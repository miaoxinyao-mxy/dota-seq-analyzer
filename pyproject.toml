[build-system]
requires = ["hatchling >= 1.26"]
build-backend = "hatchling.build"

[project]
# 2026-08-11: Rename the public distribution to DoTA-Seq Analyzer.
# Reason: the workflow now supports arbitrary targets and phase variation, not only AMR.
name = "dota-seq-analyzer"
version = "0.1.0"
authors = [
  { name="Xinyao Miao", email="miaoxinyao.xjtu@gmail.com" },
  { name="Julianna Yuen", email="juliannayuen07@gmail.com" },
  { name="Freeman Lan", email="freeman.lan@utoronto.ca" },
]
description = "Single-cell profiling of targeted microbial genes and phase variation"
readme = "README.md"
requires-python = ">=3.13.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
license = "MIT"
license-files = ["LICENSE"]

# 2026-08-11: Install the complete workflow as the public dota-seq-analyzer command.
# Reason: the command name should match the broader software name.
[project.scripts]
dota-seq-analyzer = "dota_seq_analyzer.cli:main"

# 2026-08-10: Keep separately distributed databases out of Python package archives.
# Reason: the repository retrieves reference databases with Git LFS, so embedding them duplicates large files.
[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/README.md",
  "/LICENSE",
  "/pyproject.toml",
]

[tool.hatch.build.targets.wheel]
packages = ["src/dota_seq_analyzer"]
