[build-system]
requires = ["hatchling >= 1.26"]
build-backend = "hatchling.build"

[project]
# 2026-08-10: Use the public DoTA-AMR distribution name.
# Reason: the legacy repository name should not be used as the software name.
name = "dota-amr"
version = "0.1.0"
authors = [
  { name="Julianna Yuen", email="juliannayuen07@gmail.com" },
]
description = "A software for identifying antibiotic resistance genes in bacteria"
readme = "README.md"
requires-python = ">=3.13.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
license = "MIT"
license-files = ["LICENSE"]

# 2026-08-10: Install the complete workflow as the public dotaseq-amr command.
# Reason: users should run paired R1/R2 inputs through one supported entry point.
[project.scripts]
dotaseq-amr = "dota_amr.cli:main"

# 2026-08-10: Keep separately distributed databases out of Python package archives.
# Reason: the repository retrieves reference databases with Git LFS, so embedding them duplicates large files.
[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/README.md",
  "/LICENSE",
  "/pyproject.toml",
]

[tool.hatch.build.targets.wheel]
packages = ["src/dota_amr"]
