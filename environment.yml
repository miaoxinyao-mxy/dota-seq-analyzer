# 2026-08-11: Rename the reproducible environment for DoTA-Seq Analyzer.
# Reason: the environment should match the public software name.
name: dota-seq-analyzer

channels:
  - conda-forge
  - bioconda
  - defaults

dependencies:
  - python=3.13
  - pip
  - pandas
  - numpy
  - scipy
  - matplotlib
  - biopython
  - kraken2
  - blast
  - primer3
